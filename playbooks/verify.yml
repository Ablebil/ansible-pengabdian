- name: Verify workshop VMs
  hosts: workshop_vms
  become: true

  tasks:
    # linux users
    - name: Verify participant Linux users
      ansible.builtin.command:
        cmd: "id {{ participant_username_prefix }}{{ '%02d' | format(item) }}"
      changed_when: false
      loop: "{{ range(participant_start, participant_end + 1, participant_step) | list }}"

    # node.js
    - name: Verify Node.js
      ansible.builtin.command:
        cmd: node --version
      register: node_version
      changed_when: false

    - name: Show Node.js version
      ansible.builtin.debug:
        msg: "Node.js: {{ node_version.stdout }}"

    - name: Verify npm
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version
      changed_when: false

    - name: Show npm version
      ansible.builtin.debug:
        msg: "npm: {{ npm_version.stdout }}"

    # mysql
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify MySQL service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['mysql.service'].state == 'running'
        fail_msg: "MySQL service is not running."

    - name: Verify participant MySQL users
      ansible.builtin.command:
        cmd: >
          mysql
          --protocol=socket
          --socket=/var/run/mysqld/mysqld.sock
          --batch
          --skip-column-names
          -e "SELECT User
              FROM mysql.user
              WHERE User = '{{ participant_username_prefix }}{{ '%02d' | format(item) }}'
              AND Host = 'localhost';"
      register: mysql_user_check
      changed_when: false
      failed_when: >-
        mysql_user_check.rc != 0 or
        (mysql_user_check.stdout | trim) != (participant_username_prefix ~ ('%02d' | format(item)))
      loop: "{{ range(participant_start, participant_end + 1, participant_step) | list }}"

    - name: Verify participant can create database and foreign keys
      ansible.builtin.shell:
        cmd: |
          set -e
          u="{{ participant_username_prefix }}{{ '%02d' | format(item) }}"
          db="{{ participant_database_prefix }}${u}"
          export MYSQL_PWD="{{ participant_password_prefix }}{{ '%02d' | format(item) }}"
          q() { mysql -h 127.0.0.1 -P {{ mysql_port }} -u "$u" --batch --skip-column-names -e "$1"; }
          existed="$(q "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = '${db}';")"
          q "CREATE DATABASE IF NOT EXISTS \`${db}\`;
             DROP TABLE IF EXISTS \`${db}\`.__verify_c, \`${db}\`.__verify_p;
             CREATE TABLE \`${db}\`.__verify_p (id INT PRIMARY KEY);
             CREATE TABLE \`${db}\`.__verify_c (id INT PRIMARY KEY, pid INT,
               FOREIGN KEY (pid) REFERENCES \`${db}\`.__verify_p(id));
             DROP TABLE \`${db}\`.__verify_c, \`${db}\`.__verify_p;"
          if [ -z "$existed" ]; then
            q "DROP DATABASE \`${db}\`;"
          fi
      changed_when: false
      loop: "{{ range(participant_start, participant_end + 1, participant_step) | list }}"

    - name: Verify systemd linger is enabled
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ participant_username_prefix }}{{ '%02d' | format(item) }}"
      register: linger_check
      failed_when: not linger_check.stat.exists
      loop: "{{ range(participant_start, participant_end + 1, participant_step) | list }}"

    # redis
    - name: Verify Redis service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['redis-server.service'].state == 'running'
        fail_msg: "Redis service is not running."

    - name: Verify Redis responds with PONG
      ansible.builtin.command:
        cmd: "redis-cli -p {{ redis_port }} ping"
      register: redis_ping
      changed_when: false

    - name: Assert Redis response
      ansible.builtin.assert:
        that:
          - redis_ping.stdout | trim == "PONG"
        fail_msg: "Redis did not respond with PONG."

    - name: Verify Redis database count
      ansible.builtin.command:
        cmd: "redis-cli -p {{ redis_port }} CONFIG GET databases"
      register: redis_database_config
      changed_when: false

    - name: Assert Redis database count
      ansible.builtin.assert:
        that:
          - redis_database_config.stdout_lines[1] | int == redis_database_count
        fail_msg: >-
          Redis database count is
          {{ redis_database_config.stdout_lines[1] }},
          expected {{ redis_database_count }}.

    # docker
    - name: Verify Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        msg: "Docker: {{ docker_version.stdout }}"

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        msg: "Docker Compose: {{ docker_compose_version.stdout }}"

    - name: Read Docker registry mirrors
      ansible.builtin.command:
        cmd: "docker info --format '{% raw %}{{json .RegistryConfig.Mirrors}}{% endraw %}'"
      register: docker_mirrors
      changed_when: false

    - name: Assert no Docker registry mirror is active
      ansible.builtin.assert:
        that:
          - docker_mirrors.stdout | trim in ['[]', 'null']
        fail_msg: >-
          Registry mirror masih aktif: {{ docker_mirrors.stdout }}.
          Isi /etc/docker/daemon.json dengan "registry-mirrors": [] lalu
          jalankan systemctl reload docker.

    - name: Verify shared images are pre-pulled
      ansible.builtin.command:
        cmd: "docker image inspect {{ item }}"
      changed_when: false
      loop: "{{ docker_prepull_images }}"

    - name: Show host capacity (35 Compose stack per VM)
      ansible.builtin.debug:
        msg: >-
          CPU {{ ansible_facts['processor_vcpus'] }} vCPU,
          RAM {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GiB,
          disk / free {{ ((ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first).size_available / 1024**3) | round(1) }} GiB

    # final verification message
    - name: Verification completed
      ansible.builtin.debug:
        msg: >-
          Workshop VM verification passed for participants
          {{ participant_start }} through {{ participant_end }}
          with step {{ participant_step }}.
