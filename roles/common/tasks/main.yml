- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - git
      - unzip
      - vim
      - htop
    state: present

- name: Set timezone
  ansible.builtin.command:
    cmd: timedatectl set-timezone "{{ workshop_timezone }}"
  changed_when: false
