- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
    autoremove: true

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create Docker keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true

- name: Update apt cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Configure Docker daemon (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    mode: "0644"
  notify: Restart Docker

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Apply Docker daemon changes before pulling images
  ansible.builtin.meta: flush_handlers

- name: Pre-pull shared workshop images
  ansible.builtin.command:
    cmd: "docker pull {{ item }}"
  register: docker_prepull
  changed_when: "'Downloaded newer image' in docker_prepull.stdout"
  loop: "{{ docker_prepull_images }}"

- name: Add workshop users to docker group
  ansible.builtin.user:
    name: "{{ participant_username_prefix }}{{ '%02d' | format(item) }}"
    groups: docker
    append: true
  loop: "{{ range(participant_start, participant_end + 1, participant_step) | list }}"
